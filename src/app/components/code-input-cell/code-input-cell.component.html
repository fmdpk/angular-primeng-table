<div class="flex flex-column gap-1 w-full">
  <div class="relative w-full">
    <input
      pInputText
      type="text"
      [ngModel]="row[column.field]"
      (ngModelChange)="onChange($event)"
      class="w-full"
      [style.padding-left]="'2rem'"
      [class.p-invalid]="
        table.isFieldTouched(row, column.field) &&
        table.getFieldError(row, column.field)
      "
    />
    <i
      class="pi pi-ellipsis-h absolute cursor-pointer text-color-secondary"
      style="left: 0.6rem; top: 50%; transform: translateY(-50%)"
      (click)="openDialog()"
    ></i>
  </div>

  @if (
    table.isFieldTouched(row, column.field) &&
      table.getFieldError(row, column.field);
    as err
  ) {
    <small class="p-error text-xs">{{ err }}</small>
  }
</div>

<p-dialog
  header="انتخاب محصول"
  [(visible)]="isDialogVisible"
  [modal]="true"
  [style]="{ width: '40rem' }"
>
  <p-table
    [value]="dialogProducts"
    [(selection)]="selectedDialogRow"
    selectionMode="single"
    dataKey="id"
    styleClass="p-datatable-sm"
    [scrollable]="true"
    [scrollHeight]="'250px'"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>کد</th>
        <th>نام محصول</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-product>
      <tr [pSelectableRow]="product">
        <td>{{ product.code }}</td>
        <td>{{ product.name }}</td>
      </tr>
    </ng-template>
  </p-table>

  <ng-template pTemplate="footer">
    <p-button
      label="تایید"
      icon="pi pi-check"
      (onClick)="confirmSelection()"
      [disabled]="!selectedDialogRow()"
    />
    <p-button
      label="لغو"
      icon="pi pi-times"
      severity="secondary"
      [outlined]="true"
      (onClick)="isDialogVisible.set(false)"
    />
  </ng-template>
</p-dialog>
